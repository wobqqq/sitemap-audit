version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - bodyclose
    - copyloopvar
    - errcheck
    - errorlint
    - forcetypeassert
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - nilerr
    - noctx
    - nolintlint
    - perfsprint
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - wastedassign
  settings:
    gocritic:
      enabled-tags: [diagnostic, performance]
      disabled-checks: [hugeParam, rangeValCopy]
    gosec:
      excludes:
        - G304
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: indent-error-flow
        - name: error-strings
        - name: receiver-naming
        - name: unused-parameter
          disabled: true
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters: [gosec, noctx, forcetypeassert, bodyclose, unparam, perfsprint]
      - path: internal/testsite/
        linters: [gosec]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/wobqqq/sitemap-audit
